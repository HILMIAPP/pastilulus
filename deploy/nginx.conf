# =============================================================================
# Nginx config untuk lolosujian (Next.js standalone)
# Letakkan file ini di: /etc/nginx/sites-available/lolosujian
# Lalu: sudo ln -s /etc/nginx/sites-available/lolosujian /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP → HTTPS (aktifkan setelah SSL terpasang)
    # return 301 https://$host$request_uri;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # ── Static assets Next.js (_next/static) — cache 1 tahun ───────────────
    location /_next/static/ {
        alias /var/www/lolosujian/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Public folder (gambar, favicon, dll) ───────────────────────────────
    location /assets/ {
        alias /var/www/lolosujian/public/assets/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /materi/ {
        alias /var/www/lolosujian/public/materi/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Proxy ke Next.js server (port 3000) ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Buffer
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
}

# =============================================================================
